name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.10']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install system dependencies for Kaleido
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium-browser \
            chromium-chromedriver \
            libasound2 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libatspi2.0-0 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libx11-xcb1 \
            libxcb-dri3-0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libxshmfence1 \
            xdg-utils \
            fonts-liberation
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
      
      - name: Verify installation
        run: |
          python --version
          pip list
          python -c "import sys; print(f'Python path: {sys.path}')"
          python -c "import pandas; print(f'Pandas version: {pandas.__version__}')"
          python -c "import streamlit; print(f'Streamlit version: {streamlit.__version__}')"
      
      - name: Run test suite
        run: |
          pytest tests/ -v --tb=short --maxfail=5
        env:
          PYTHONPATH: .
      
      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=src/macro_econ_data_archive --cov-report=xml --cov-report=term-missing
        env:
          PYTHONPATH: .
        continue-on-error: true
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true
        if: always()
      
      - name: CLI smoke test
        run: |
          python generate_macro_report.py --help
          python generate_macro_report.py --list-templates
        env:
          PYTHONPATH: .
      
      - name: Verify imports
        run: |
          python -c "from src.macro_econ_data_archive import macro_utils"
          python -c "from src.macro_econ_data_archive import report_generator"
          python -c "from src.macro_econ_data_archive import streamlit_app"
        env:
          PYTHONPATH: .

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      
      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files --show-diff-on-failure
        continue-on-error: true
